name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit (the tag is in the comment); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # While @sapphirelabs/ui is used from a local folder ("file:../sapphire-ui"),
      # fetch it next to this repository. Once the dependency is a version from
      # npm, this step does nothing.
      - name: Fetch @sapphirelabs/ui when used from a folder
        run: |
          if grep -q '"file:../sapphire-ui"' package.json; then
            git clone --depth 1 https://github.com/sapphire-labs-dev/sapphire-ui.git ../sapphire-ui
          fi

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
